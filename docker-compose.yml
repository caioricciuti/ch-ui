# CH-UI quick-start with a local ClickHouse.
#
#   docker compose up -d
#   open http://localhost:3488
#
# Sign in as ClickHouse user "admin" with password "change-me-admin-password"
# (or whatever you set in CLICKHOUSE_ADMIN_USER / CLICKHOUSE_ADMIN_PASSWORD).
# The first ClickHouse admin to sign in becomes the CH-UI admin.
#
# In production, set APP_SECRET_KEY to a strong random value (it encrypts stored
# credentials) and terminate TLS at a proxy or via tls_cert_file/tls_key_file.
services:
  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    # Or build locally: build: .
    restart: unless-stopped
    ports:
      # Bound to localhost. Publish on all interfaces only behind TLS.
      - "127.0.0.1:3488:3488"
    environment:
      # CHANGE THIS in production. It encrypts API keys and session credentials.
      APP_SECRET_KEY: ${APP_SECRET_KEY:-please-change-me-to-a-random-secret}
      CLICKHOUSE_URL: http://clickhouse:8123
      CONNECTION_NAME: Local ClickHouse
      # Forward audit events to your SIEM (optional):
      # AUDIT_FORWARD_STDOUT: "true"
      # AUDIT_WEBHOOK_URL: https://siem.example.com/hook
    volumes:
      - ch_ui_data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    # Same image and digest CI tests against (ci.yml, mirror-images.yml).
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      # The ClickHouse user you sign in to CH-UI with. Change the password
      # before exposing this anywhere. Access management lets this user read
      # system.users, so CH-UI recognizes it as an admin.
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-change-me-admin-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ch_ui_data:
  clickhouse_data:
