version: 2

# Cooldown mirrors the 7-day minimum release age enforced on the maintainer
# machine (~/.npmrc min-release-age, pnpm minimumReleaseAge). A package too
# fresh to install locally should not arrive as a PR either. Majors wait
# longer: they need a migration pass, not a merge.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"

  # ui/ and site/ are managed by bun (bun.lock only). The npm ecosystem
  # cannot update bun.lock and fails silently, opening no PRs.
  - package-ecosystem: bun
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      ui-dependencies:
        patterns:
          - "*"
    ignore:
      # svelte-check crashes under TypeScript 7; revisit when the Svelte
      # toolchain supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: "/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      site-dependencies:
        patterns:
          - "*"

  # The github-actions ecosystem supports default-days only, no semver keys.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
