name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write # keyless Cosign signing via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Extract release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          BUILD_DATE="$(git show -s --format=%cI "${GITHUB_SHA}")"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"

      - name: Build frontend
        run: make build-frontend

      - name: Cross-compile binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ steps.release.outputs.build_date }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          LDFLAGS="-s -w \
            -X main.Version=${VERSION} \
            -X main.Commit=${COMMIT} \
            -X main.BuildDate=${DATE}"

          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o dist/ch-ui-linux-amd64 .

          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o dist/ch-ui-linux-arm64 .

          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o dist/ch-ui-darwin-amd64 .

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o dist/ch-ui-darwin-arm64 .

      - name: Alpine smoke test
        shell: bash
        run: |
          set -euo pipefail

          chmod +x dist/ch-ui-linux-amd64

          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            alpine:3.20 \
            /dist/ch-ui-linux-amd64 version

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail

          sha256sum ch-ui-* > checksums.txt
          cat checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/ch-ui-sbom.cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned to the v2 line deliberately. cosign v3 requires --bundle
          # for sign-blob, which changes what a release publishes: the
          # checksums.txt.sig and checksums.txt.pem files people verify
          # against. This installer defaults to v3.0.6, so without this line
          # an installer bump would move the signing tool a major version
          # without that appearing in any diff. Moving to v3 is its own
          # change, to be proven on a throwaway tag first.
          cosign-release: v2.6.5

      - name: Sign checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail

          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${VERSION}"
          TITLE="${TAG}"
          REPO="${{ github.repository }}"
          NOTES_FILE="$(mktemp)"

          cat > "${NOTES_FILE}" <<EOF
          ## Install

          Download the binary for your platform and run it:

          \`\`\`bash
          # Linux (amd64)
          curl -L -o ch-ui \
            https://github.com/${REPO}/releases/download/${TAG}/ch-ui-linux-amd64

          chmod +x ch-ui
          sudo install -m 755 ch-ui /usr/local/bin/ch-ui

          ch-ui
          \`\`\`

          If you don't want a global install, run it as \`./ch-ui\`.

          ## Verify checksum

          \`\`\`bash
          sha256sum -c checksums.txt
          \`\`\`
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}"
          fi

          gh release upload "${TAG}" \
            dist/ch-ui-linux-amd64 \
            dist/ch-ui-linux-arm64 \
            dist/ch-ui-darwin-amd64 \
            dist/ch-ui-darwin-arm64 \
            dist/checksums.txt \
            dist/checksums.txt.sig \
            dist/checksums.txt.pem \
            dist/ch-ui-sbom.cyclonedx.json \
            --clobber

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}

      - name: Sign Docker image
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
