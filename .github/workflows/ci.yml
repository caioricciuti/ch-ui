name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
        env:
          CLICKHOUSE_USER: release_admin
          CLICKHOUSE_PASSWORD: ci-test-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 18123:8123
        options: >-
          --health-cmd "wget -q -O - http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # frontend.go embeds ui/dist via //go:embed; the backend job doesn't build
      # the UI, so provide a placeholder file so the package compiles for
      # vet/test/govulncheck. Real builds (Docker/release) embed the actual UI.
      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p ui/dist
          printf '<!doctype html><title>ch-ui</title>' > ui/dist/index.html

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./connector)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:"
            echo "${unformatted}"
            echo "Run: gofmt -w ./cmd ./internal ./connector"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Background workers against ClickHouse
        env:
          CHUI_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
          CHUI_TEST_CLICKHOUSE_USER: release_admin
          CHUI_TEST_CLICKHOUSE_PASSWORD: ci-test-only
        run: |
          curl --fail --silent --show-error --user "$CHUI_TEST_CLICKHOUSE_USER:$CHUI_TEST_CLICKHOUSE_PASSWORD" \
            "$CHUI_TEST_CLICKHOUSE_URL" --data-binary \
            'CREATE TABLE default.otel_logs (Timestamp DateTime64(9), Body String) ENGINE=MergeTree ORDER BY Timestamp'
          go test ./internal/scheduler ./internal/models ./internal/pipelines \
            ./internal/clusterhealth ./internal/governance ./internal/telemetry/monitor \
            -run TestBackgroundAccountExecution -count=1 -race

      - name: Operations and telemetry against ClickHouse
        env:
          CHUI_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
          CHUI_TEST_CLICKHOUSE_USER: release_admin
          CHUI_TEST_CLICKHOUSE_PASSWORD: ci-test-only
        run: |
          go test ./internal/performance -run TestPerformanceQueryLive -count=1 -race -args -performance-fixtures
          go test ./internal/operations -run TestScheduledReportUsesDedicatedAccountAndPersistsOnce -count=1 -race
          go test ./internal/server/handlers -run TestSchemaCompareLive -count=1 -race
          go test ./internal/incidenttimeline -run TestIncidentTimelineQueriesLive -count=1 -race
          go test ./internal/telemetry -run TestHistogramWindowLive -count=1 -race

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Dependency audit
        run: bun audit

      - name: Build
        run: bun run build
