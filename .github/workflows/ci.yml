name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # release.yml calls this workflow so a tag is built only after the full
  # suite passes on the tagged commit.
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Pushes to main are never
# cancelled, so every merged commit gets a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # frontend.go embeds ui/dist via //go:embed; the backend job doesn't build
      # the UI, so provide a placeholder file so the package compiles for
      # vet/test/govulncheck. Real builds (Docker/release) embed the actual UI.
      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p ui/dist
          printf '<!doctype html><title>ch-ui</title>' > ui/dist/index.html

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./connector)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:"
            echo "${unformatted}"
            echo "Run: gofmt -w ./cmd ./internal ./connector"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Every test, without the race detector: fast, and it catches failures
      # in any package. The race detector runs in the race job below.
      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  live:
    # Tests against a real ClickHouse, in parallel with the unit tests.
    name: Backend live (ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        # Mirror of clickhouse/clickhouse-server:25.8, same digest (mirror-images.yml).
        image: ghcr.io/caioricciuti/ci-clickhouse-server@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
        env:
          CLICKHOUSE_USER: release_admin
          CLICKHOUSE_PASSWORD: ci-test-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 18123:8123
        options: >-
          --health-cmd "wget -q -O - http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # frontend.go embeds ui/dist via //go:embed; the backend job doesn't build
      # the UI, so provide a placeholder file so the package compiles for
      # vet/test/govulncheck. Real builds (Docker/release) embed the actual UI.
      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p ui/dist
          printf '<!doctype html><title>ch-ui</title>' > ui/dist/index.html

      - name: Background workers against ClickHouse
        env:
          CHUI_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
          CHUI_TEST_CLICKHOUSE_USER: release_admin
          CHUI_TEST_CLICKHOUSE_PASSWORD: ci-test-only
        run: |
          curl --fail --silent --show-error --user "$CHUI_TEST_CLICKHOUSE_USER:$CHUI_TEST_CLICKHOUSE_PASSWORD" \
            "$CHUI_TEST_CLICKHOUSE_URL" --data-binary \
            'CREATE TABLE default.otel_logs (Timestamp DateTime64(9), Body String) ENGINE=MergeTree ORDER BY Timestamp'
          go test ./internal/scheduler ./internal/models ./internal/pipelines \
            ./internal/clusterhealth ./internal/governance ./internal/telemetry/monitor \
            ./internal/sqlalerts \
            -run TestBackgroundAccountExecution -count=1 -race

      - name: Operations and telemetry against ClickHouse
        env:
          CHUI_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
          CHUI_TEST_CLICKHOUSE_USER: release_admin
          CHUI_TEST_CLICKHOUSE_PASSWORD: ci-test-only
        run: |
          # The performance test takes a flag the other test binaries do not
          # define, so it runs on its own.
          go test ./internal/performance -run TestPerformanceQueryLive -count=1 -race -args -performance-fixtures
          go test ./internal/operations ./internal/server/handlers ./internal/incidenttimeline \
            ./internal/telemetry ./internal/mcpserver ./internal/ssoidentity -count=1 -race \
            -run '^(TestScheduledReportUsesDedicatedAccountAndPersistsOnce|TestSchemaCompareLive|TestReadonlyProfileUserLive|TestIncidentTimelineQueriesLive|TestHistogramWindowLive|TestMCPReadonlyAndAllowListLive|TestSSOProvisionLive|TestSSOProbeLive)$'

  race:
    # The race detector makes tests about ten times slower, so it is split
    # over four runners. On a pull request each shard runs only the packages
    # the change can affect (.github/ci/raceplan); on main and for releases
    # every package runs.
    name: Backend race (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; HEAD^1 is the base.
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p ui/dist
          printf '<!doctype html><title>ch-ui</title>' > ui/dist/index.html

      - name: Plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          go run ./.github/ci/raceplan -shard ${{ matrix.shard }} -shards 4 -base "$BASE" > race-plan.txt
          cat race-plan.txt

      - name: Test with the race detector
        run: |
          set -euo pipefail
          if [ ! -s race-plan.txt ]; then
            echo "Nothing in this shard is affected by the change."
            exit 0
          fi
          while IFS= read -r line; do
            read -ra args <<< "$line"
            go test -race -count=1 "${args[@]}"
          done < race-plan.txt

  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/.bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Dependency audit
        run: bun audit

      - name: Build
        run: bun run build

  site:
    name: Site (Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/.bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One advisory ignored, build-time only (the site is static):
      # GHSA-rj75-hqrm-r3gf postcss-selector-parser 6.x (via postcss-nested
      # in expressive-code). Fixed only in 7.1.6, a major the dependents do
      # not accept; it parses our own CSS, never untrusted input.
      - name: Dependency audit
        run: bun audit --ignore=GHSA-rj75-hqrm-r3gf

      # The build is the check: it regenerates the changelog page from
      # CHANGELOG.md, renders every page and fails on a sidebar entry that
      # names a page which does not exist.
      - name: Build
        run: bun run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The chart's appVersion is the image tag it deploys by default, so it
      # has to move with every release.
      - name: Chart appVersion matches VERSION
        run: |
          want="$(tr -d '[:space:]' < VERSION)"
          got="$(sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' deploy/helm/ch-ui/Chart.yaml)"
          echo "VERSION:    ${want}"
          echo "appVersion: ${got}"
          if [ "${want}" != "${got}" ]; then
            echo "deploy/helm/ch-ui/Chart.yaml appVersion must equal VERSION"
            exit 1
          fi

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Lint chart
        run: helm lint deploy/helm/ch-ui

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same Dockerfile and actions as the release, for one platform and
      # without pushing, so a broken base image or build step fails the pull
      # request instead of the release.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ch-ui:ci

      - name: Smoke test
        run: |
          docker run --rm --entrypoint ch-ui ch-ui:ci version
          docker image inspect ch-ui:ci --format '{{.Config.User}}' | grep -qx chui
